# Integration tests only (DockerComposeInitializer). Same services as docker-compose.yml, on host ports that clash
# with nothing else on the same Docker (local dev compose, sibling projects): postgres 15432. Its own project name, so a running dev compose is never taken for it.
name: arcadia-kotlin-it
services:
  postgresql:
    image: postgres:16.3
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "15432:5432"

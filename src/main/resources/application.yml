logging:
  level:
    com.arcadiaeditions: DEBUG

springdoc:
  swagger-ui:
    urls:
      - name: Arcadia Editions Modulith
        url: /orders-checkout-openapi.yml

app:
  events:
    resubmit-incomplete-publications-older-than: PT5M

management:
  endpoints.web.exposure.include: "*"

spring:
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - classpath:/com/arcadiaeditions/modulith/application/arcadia-editions-modulith/
  security:
    user:
      name: admin
      password: password
      roles: USER
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      poolName: Hikari
      auto-commit: false
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

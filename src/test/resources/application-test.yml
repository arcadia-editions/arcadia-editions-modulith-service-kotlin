logging.level.org.hibernate.SQL: DEBUG
logging.level.org.springframework.transaction: DEBUG

spring.jpa.hibernate.ddl-auto: create
arcadia.fake-adapters.enabled: true
spring.jpa.defer-datasource-initialization: true
spring.sql.init.mode: always

DATASOURCE_URL: jdbc:postgresql://localhost:15432/app
DATASOURCE_USERNAME: postgres
DATASOURCE_PASSWORD: admin123

# T-31 job off in test contexts; tests call releaseExpiredReservations() after moving the MutableClock
catalog-inventory.reservation-expired-job.enabled: false
